services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-envmgr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme123}
      POSTGRES_DB: ${POSTGRES_DB:-envmanager}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-envmgr} -d ${POSTGRES_DB:-envmanager}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"   # API accessible externally for CLI and direct access
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-envmgr}:${POSTGRES_PASSWORD:-changeme123}@db/${POSTGRES_DB:-envmanager}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ALLOWED_ORIGINS: '["http://localhost","http://localhost:8080","http://${SERVER_IP:-10.10.10.102}","http://${SERVER_IP:-10.10.10.102}:8080","https://${DOMAIN:-localhost}"]'
      # Email — leave SMTP_HOST blank to disable (registration still works without it)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-ENV Manager}
      SMTP_TLS: ${SMTP_TLS:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      APP_URL: ${APP_URL:-http://${SERVER_IP:-10.10.10.102}:8080}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
